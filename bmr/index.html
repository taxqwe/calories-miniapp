<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Метаболизм</title>
  <link rel="stylesheet" href="style.css">
  <!-- Telegram WebApp API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="page" id="page">

    <!-- ── Шапка ── -->
    <header class="page__header">
      <h1 class="page__title" id="page-title"></h1>
      <p class="page__subtitle" id="page-subtitle"></p>
    </header>

    <!-- ── Онбординг-баннер (только первичный расчёт) ── -->
    <div class="onb-guide" id="onb-guide" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      <p id="onb-guide-text"></p>
    </div>

    <!-- ── Профиль не загрузился: сохранение заблокировано ── -->
    <div class="profile-banner" id="profile-banner" hidden>
      <span id="profile-banner-text"></span>
      <button type="button" class="profile-banner__btn" id="profile-banner-btn"></button>
    </div>

    <!-- ── Hero: целевые калории + базовый обмен ── -->
    <section class="metab-hero" id="metab-hero">
      <div class="metab-hero__label" id="hero-label"></div>
      <div class="metab-hero__value">
        <span id="hero-value">—</span><span class="unit" id="hero-unit"></span>
      </div>
      <div class="metab-hero__meta" id="hero-meta"></div>
    </section>

    <form id="bmr-form" novalidate>

      <!-- ── Данные тела ── -->
      <section class="card">
        <h2 class="card__title" id="body-section-title"></h2>
        <div class="metab-rows">
          <label class="metab-field">
            <span class="metab-field__label" id="label-height"></span>
            <input class="metab-field__input" type="text" id="height" name="height"
              inputmode="numeric" autocomplete="off" enterkeyhint="next" placeholder="">
          </label>
          <label class="metab-field">
            <span class="metab-field__label" id="label-weight"></span>
            <input class="metab-field__input" type="text" id="weight" name="weight"
              inputmode="numeric" autocomplete="off" enterkeyhint="next" placeholder="">
          </label>
          <label class="metab-field">
            <span class="metab-field__label" id="label-age"></span>
            <input class="metab-field__input" type="text" id="age" name="age"
              inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="">
          </label>
        </div>
        <div class="segmented" id="gender-seg" role="group">
          <button type="button" class="segmented__item" id="gender-male" data-value="m"></button>
          <button type="button" class="segmented__item" id="gender-female" data-value="f"></button>
        </div>
      </section>

      <!-- ── Активность ── -->
      <section class="card">
        <h2 class="card__title" id="activity-section-title"></h2>
        <div class="activity-row">
          <span id="activity-row-label"></span>
          <span class="activity-row__level" id="activity-level-name"></span>
        </div>
        <input class="metab-range" type="range" id="activityRange" name="activity" min="1" max="5" step="1" value="3">
        <div class="metab-ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
        <div class="activity-note" id="activity-note"></div>
      </section>

      <!-- ── Цель ── -->
      <section class="card" id="goal-card">
        <div class="switch-row">
          <label for="goal-toggle" id="label-goal-toggle"></label>
          <label class="switch">
            <input type="checkbox" id="goal-toggle">
            <span class="switch__slider"></span>
          </label>
        </div>
        <div class="segmented" id="goal-seg" role="group" hidden>
          <button type="button" class="segmented__item" id="goal-deficit" data-value="deficit"></button>
          <button type="button" class="segmented__item" id="goal-surplus" data-value="surplus"></button>
        </div>
        <div class="goal-note" id="goal-note" hidden></div>
      </section>

      <!-- ── Цели по БЖУ ── -->
      <section class="card" id="macro-card" hidden>
        <div class="switch-row">
          <label for="macro-toggle" id="label-macro-toggle"></label>
          <label class="switch">
            <input type="checkbox" id="macro-toggle">
            <span class="switch__slider"></span>
          </label>
        </div>
        <div class="macro-body" id="macro-body" hidden>
          <div class="macro-ref" role="radiogroup">
            <span class="macro-ref__caption" id="macro-ref-label"></span>
            <label class="macro-ref__option">
              <input type="radio" name="macro-ref" id="macro-ref-current" value="current" checked>
              <span id="macro-ref-current-label"></span>
            </label>
            <div class="macro-ref__option">
              <input type="radio" name="macro-ref" id="macro-ref-desired" value="desired">
              <label class="macro-ref__desired-label" for="desired-weight" id="macro-ref-desired-label"></label>
              <input class="macro-ref__weight" type="text" id="desired-weight"
                inputmode="numeric" autocomplete="off" placeholder="—">
              <span class="macro-ref__unit" id="macro-desired-unit"></span>
            </div>
            <div class="macro-ref__hint" id="macro-desired-hint" hidden></div>
          </div>
          <div class="chips" id="macro-chips" role="group"></div>
          <div class="macro-custom" id="macro-custom" hidden></div>
          <div class="macro-zero-note" id="macro-zero-note" hidden></div>
          <div class="macro-preview" id="macro-preview" hidden>
            <div class="macro-preview__line" id="macro-preview-line"></div>
            <div class="macro-preview__formula" id="macro-preview-formula" hidden></div>
            <div class="macro-bar" id="macro-bar" hidden><div class="macro-bar__fill" id="macro-bar-fill"></div></div>
            <div class="macro-bar__caption" id="macro-bar-caption" hidden></div>
          </div>
          <div class="macro-banner" id="macro-banner" hidden>
            <span id="macro-banner-text"></span>
            <button type="button" class="macro-banner__btn" id="macro-banner-btn" hidden></button>
          </div>
        </div>
      </section>

      <!-- ── Предпочтения ── -->
      <section class="card" id="preferences-card">
        <h2 class="card__title" id="preferences-section-title"></h2>
        <div class="chips" id="preferences-chips" role="group"></div>
      </section>

      <button type="submit" class="metab-cta" id="calculate-button"></button>
      <div class="cta-hint" id="cta-hint"></div>
    </form>

    <div id="result" class="result"></div>
  </div>

  <script src="../config.js"></script>
  <script src="../timezone-sync.js"></script>
  <script src="macro-goals-i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
