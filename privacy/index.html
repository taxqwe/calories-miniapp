<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Privacy Policy · Политика конфиденциальности</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var lang = (params.get('lang') || navigator.language || 'en').toLowerCase().split('-')[0];
      window.location.replace(lang === 'ru' ? 'ru/' : 'en/');
    })();
  </script>
</head>
<body>
  <main>
    <h1>Privacy Policy and Terms of Use</h1>
    <p><a href="en/">English</a> · <a href="ru/">Русский</a></p>
  </main>
</body>
</html>
